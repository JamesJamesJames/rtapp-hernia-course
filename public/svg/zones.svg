<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Zone gradients -->
    <linearGradient id="zone1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#CD853F;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="zone2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#32CD32;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="zone3Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0.3" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern for zone borders -->
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" style="stroke:#fff; stroke-width:2; stroke-opacity:0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a2e"/>

  <!-- Base Anatomy (subtle) -->
  <g id="layer-base" data-layer="base" opacity="0.4">
    <!-- Abdominal wall outline -->
    <ellipse cx="400" cy="320" rx="320" ry="240" fill="none" stroke="#444" stroke-width="2"/>

    <!-- Iliopsoas outline -->
    <path d="M 580 350 Q 620 400 640 500 Q 620 550 580 560 Q 540 540 520 480 Q 530 400 580 350"
          fill="none" stroke="#8B4513" stroke-width="2"/>

    <!-- Pubic symphysis -->
    <ellipse cx="180" cy="520" rx="40" ry="25" fill="#444" stroke="#666" stroke-width="1"/>
  </g>

  <!-- Zone Overlays -->
  <g id="layer-zones" data-layer="zones">
    <!-- Zone 1: Lateral Space (Tan/Beige) -->
    <path id="zone_1_area"
          data-landmark-id="zone_1_area"
          class="landmark-path zone-overlay"
          d="M 450 200 Q 550 220 620 280 Q 680 360 700 480 Q 680 540 620 560 Q 550 560 480 520 Q 440 460 420 380 Q 430 280 450 200"
          fill="url(#zone1Gradient)"
          stroke="#DEB887"
          stroke-width="3"/>

    <!-- Zone 2: Medial Direct Space (Green) -->
    <path id="zone_2_area"
          data-landmark-id="zone_2_area"
          class="landmark-path zone-overlay"
          d="M 100 280 Q 150 240 250 220 Q 320 210 350 240 Q 360 320 340 420 Q 300 500 220 540 Q 140 550 100 500 Q 80 420 100 280"
          fill="url(#zone2Gradient)"
          stroke="#228B22"
          stroke-width="3"/>

    <!-- Zone 3: Central High-Risk (Red) -->
    <path id="zone_3_area"
          data-landmark-id="zone_3_area"
          class="landmark-path zone-overlay"
          d="M 350 240 Q 400 200 450 200 Q 430 280 420 380 Q 440 460 480 520 Q 420 540 340 520 Q 300 500 340 420 Q 360 320 350 240"
          fill="url(#zone3Gradient)"
          stroke="#DC143C"
          stroke-width="3"/>
  </g>

  <!-- Key Structures (reference) -->
  <g id="layer-structures" data-layer="structures" opacity="0.7">
    <!-- IEV (vertical) -->
    <path d="M 350 320 Q 340 250 330 180 Q 325 140 320 100"
          fill="none" stroke="#DC3545" stroke-width="6" stroke-linecap="round"/>

    <!-- Vas (medial) -->
    <path d="M 360 330 Q 320 360 280 400 Q 240 440 200 480"
          fill="none" stroke="#F5F5DC" stroke-width="4" stroke-linecap="round"/>

    <!-- Spermatic (lateral) -->
    <path d="M 420 330 Q 480 350 520 380 Q 560 400 590 430"
          fill="none" stroke="#4169E1" stroke-width="5" stroke-linecap="round"/>

    <!-- Deep Ring indicator -->
    <ellipse cx="385" cy="330" rx="40" ry="28"
             fill="none" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- Iliopubic tract -->
    <path d="M 150 450 Q 300 460 450 455 Q 550 450 650 440"
          fill="none" stroke="#191970" stroke-width="3" stroke-dasharray="10,5"/>
  </g>

  <!-- Zone Labels -->
  <g id="layer-labels" data-layer="labels" font-family="Arial, sans-serif">
    <!-- Zone 1 Label -->
    <g transform="translate(560, 380)">
      <rect x="-60" y="-35" width="120" height="70" rx="8" fill="#DEB887" opacity="0.9"/>
      <text x="0" y="-10" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">ZONE 1</text>
      <text x="0" y="10" text-anchor="middle" font-size="12" fill="#555">Lateral Space</text>
      <text x="0" y="28" text-anchor="middle" font-size="10" fill="#666">Safe (watch nerves)</text>
    </g>

    <!-- Zone 2 Label -->
    <g transform="translate(200, 350)">
      <rect x="-65" y="-35" width="130" height="70" rx="8" fill="#32CD32" opacity="0.9"/>
      <text x="0" y="-10" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">ZONE 2</text>
      <text x="0" y="10" text-anchor="middle" font-size="12" fill="#555">Medial Direct Space</text>
      <text x="0" y="28" text-anchor="middle" font-size="10" fill="#006400">SAFEST for fixation</text>
    </g>

    <!-- Zone 3 Label -->
    <g transform="translate(400, 280)">
      <rect x="-70" y="-40" width="140" height="80" rx="8" fill="#FF6B6B" opacity="0.9"/>
      <text x="0" y="-15" text-anchor="middle" font-size="18" font-weight="bold" fill="#800000">ZONE 3</text>
      <text x="0" y="5" text-anchor="middle" font-size="12" fill="#800000">Central High-Risk</text>
      <text x="0" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#8B0000">NO FIXATION!</text>
      <text x="0" y="42" text-anchor="middle" font-size="9" fill="#A00000">Triangle of Doom</text>
    </g>
  </g>

  <!-- Legend -->
  <g id="layer-legend" transform="translate(30, 30)">
    <rect x="0" y="0" width="200" height="140" rx="8" fill="rgba(0,0,0,0.7)" stroke="#444" stroke-width="1"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">THREE ZONES OF MPO</text>

    <!-- Zone 1 legend -->
    <rect x="15" y="40" width="20" height="20" fill="#DEB887" rx="3"/>
    <text x="45" y="55" font-family="Arial" font-size="12" fill="#DEB887">Zone 1 - Lateral</text>

    <!-- Zone 2 legend -->
    <rect x="15" y="70" width="20" height="20" fill="#32CD32" rx="3"/>
    <text x="45" y="85" font-family="Arial" font-size="12" fill="#32CD32">Zone 2 - Medial (Safe)</text>

    <!-- Zone 3 legend -->
    <rect x="15" y="100" width="20" height="20" fill="#DC143C" rx="3"/>
    <text x="45" y="115" font-family="Arial" font-size="12" fill="#FF6B6B">Zone 3 - DANGER</text>
  </g>

  <!-- Title -->
  <g id="layer-title">
    <text x="400" y="580" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#888">
      Click each zone to learn about its contents and safety profile
    </text>
  </g>

  <!-- Touch Hotspots -->
  <g id="layer-hotspots" data-layer="hotspots" opacity="0">
    <circle cx="560" cy="400" r="80" data-target="zone_1_area"/>
    <circle cx="220" cy="380" r="80" data-target="zone_2_area"/>
    <circle cx="400" cy="350" r="70" data-target="zone_3_area"/>
  </g>
</svg>
