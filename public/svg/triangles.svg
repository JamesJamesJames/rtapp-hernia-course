<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Danger pattern for Triangle of Doom -->
    <pattern id="doomPattern" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#DC143C" fill-opacity="0.4"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#8B0000" stroke-width="3" stroke-opacity="0.6"/>
    </pattern>

    <!-- Pain pattern -->
    <pattern id="painPattern" width="12" height="12" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#FF8C00" fill-opacity="0.3"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#FF4500" stroke-width="2" stroke-opacity="0.5"/>
    </pattern>

    <!-- Femoral pattern -->
    <pattern id="femoralPattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#9370DB" fill-opacity="0.3"/>
      <circle cx="5" cy="5" r="2" fill="#4B0082" fill-opacity="0.4"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a2e"/>

  <!-- Base anatomy (subtle reference) -->
  <g id="layer-base" data-layer="base" opacity="0.5">
    <!-- Abdominal wall outline -->
    <ellipse cx="400" cy="300" rx="320" ry="240" fill="none" stroke="#444" stroke-width="2"/>

    <!-- Iliopsoas outline -->
    <path d="M 560 320 Q 600 380 620 480 Q 600 530 560 540 Q 520 520 500 460 Q 510 380 560 320"
          fill="#8B4513" opacity="0.3" stroke="#CD853F" stroke-width="2"/>
  </g>

  <!-- Cord structures for reference -->
  <g id="layer-cord" data-layer="cord" opacity="0.8">
    <!-- IEV -->
    <path d="M 340 300 Q 330 230 320 160"
          fill="none" stroke="#DC3545" stroke-width="8" stroke-linecap="round"/>

    <!-- Vas Deferens -->
    <path id="vas-ref"
          d="M 350 310 Q 310 350 270 390 Q 230 430 190 470"
          fill="none" stroke="#F5F5DC" stroke-width="5" stroke-linecap="round"/>

    <!-- Spermatic Vessels -->
    <path id="spermatic-ref"
          d="M 410 310 Q 470 330 510 360 Q 550 390 580 420"
          fill="none" stroke="#4169E1" stroke-width="6" stroke-linecap="round"/>

    <!-- Deep Ring -->
    <ellipse cx="375" cy="310" rx="45" ry="32"
             fill="none" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- Iliopubic Tract -->
    <path d="M 140 430 Q 300 445 450 440 Q 580 430 680 420"
          fill="none" stroke="#191970" stroke-width="3" stroke-dasharray="10,5"/>
  </g>

  <!-- DANGER TRIANGLES -->
  <g id="layer-triangles" data-layer="triangles">

    <!-- Triangle of Doom (between vas and spermatic vessels) -->
    <path id="triangle_of_doom"
          data-landmark-id="triangle_of_doom"
          class="landmark-path"
          d="M 375 310 L 280 430 L 530 400 Z"
          fill="url(#doomPattern)"
          stroke="#8B0000"
          stroke-width="3"/>

    <!-- Triangle of Pain (lateral to spermatic vessels) -->
    <path id="triangle_of_pain"
          data-landmark-id="triangle_of_pain"
          class="landmark-path"
          d="M 530 400 L 580 420 L 650 420 L 600 500 L 480 460 Z"
          fill="url(#painPattern)"
          stroke="#FF4500"
          stroke-width="3"/>

    <!-- Femoral Triangle (below inguinal ligament, medial) -->
    <path id="femoral_triangle"
          data-landmark-id="femoral_triangle"
          class="landmark-path"
          d="M 280 450 L 400 480 L 350 540 L 220 520 Z"
          fill="url(#femoralPattern)"
          stroke="#9370DB"
          stroke-width="2"/>

    <!-- Direct Triangle / Hesselbach's (medial to IEV) -->
    <path id="direct_triangle"
          data-landmark-id="direct_triangle"
          class="landmark-path"
          d="M 340 300 L 280 430 L 180 440 L 200 350 L 280 280 Z"
          fill="rgba(138, 43, 226, 0.2)"
          stroke="#8A2BE2"
          stroke-width="2"
          stroke-dasharray="5,3"/>

    <!-- Indirect Triangle (lateral to IEV, at deep ring) -->
    <path id="indirect_triangle"
          data-landmark-id="indirect_triangle"
          class="landmark-path"
          d="M 340 300 L 410 310 L 450 380 L 400 430 L 340 400 Z"
          fill="rgba(255, 165, 0, 0.15)"
          stroke="#FFA500"
          stroke-width="2"
          stroke-dasharray="5,3"/>
  </g>

  <!-- Triangle Labels -->
  <g id="layer-labels" data-layer="labels" font-family="Arial, sans-serif">

    <!-- Triangle of Doom Label -->
    <g transform="translate(400, 360)">
      <rect x="-70" y="-25" width="140" height="50" rx="6" fill="rgba(139, 0, 0, 0.9)" stroke="#FF0000" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFD700">TRIANGLE OF DOOM</text>
      <text x="0" y="15" text-anchor="middle" font-size="10" fill="#FFA07A">Contains: Iliac vessels</text>
    </g>

    <!-- Triangle of Pain Label -->
    <g transform="translate(580, 470)">
      <rect x="-65" y="-25" width="130" height="50" rx="6" fill="rgba(255, 69, 0, 0.9)" stroke="#FF4500" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFF">TRIANGLE OF PAIN</text>
      <text x="0" y="15" text-anchor="middle" font-size="10" fill="#FFE4B5">Contains: Nerves (LFCN, etc.)</text>
    </g>

    <!-- Femoral Triangle Label -->
    <g transform="translate(290, 520)">
      <rect x="-55" y="-20" width="110" height="40" rx="6" fill="rgba(147, 112, 219, 0.9)" stroke="#9370DB" stroke-width="2"/>
      <text x="0" y="-2" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">FEMORAL</text>
      <text x="0" y="15" text-anchor="middle" font-size="10" fill="#E6E6FA">Femoral hernias</text>
    </g>

    <!-- Reference Labels -->
    <text x="330" y="150" font-size="12" fill="#DC3545" font-weight="bold">IEV</text>
    <text x="175" y="485" font-size="11" fill="#F5F5DC">Vas</text>
    <text x="590" y="415" font-size="11" fill="#4169E1">Spermatic</text>
    <text x="620" y="430" font-size="10" fill="#6495ED">vessels</text>
    <text x="150" y="415" font-size="10" fill="#191970">Iliopubic Tract</text>
  </g>

  <!-- Legend -->
  <g id="layer-legend" transform="translate(30, 30)">
    <rect x="0" y="0" width="220" height="180" rx="8" fill="rgba(0,0,0,0.8)" stroke="#444"/>
    <text x="110" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">DANGER TRIANGLES</text>

    <!-- Doom -->
    <rect x="15" y="45" width="20" height="20" fill="url(#doomPattern)" stroke="#8B0000" stroke-width="1"/>
    <text x="45" y="60" font-family="Arial" font-size="11" fill="#FF6B6B">Triangle of Doom (FATAL)</text>

    <!-- Pain -->
    <rect x="15" y="75" width="20" height="20" fill="url(#painPattern)" stroke="#FF4500" stroke-width="1"/>
    <text x="45" y="90" font-family="Arial" font-size="11" fill="#FFA500">Triangle of Pain (Nerves)</text>

    <!-- Femoral -->
    <rect x="15" y="105" width="20" height="20" fill="url(#femoralPattern)" stroke="#9370DB" stroke-width="1"/>
    <text x="45" y="120" font-family="Arial" font-size="11" fill="#DDA0DD">Femoral Triangle</text>

    <!-- Warning -->
    <text x="15" y="150" font-family="Arial" font-size="10" fill="#FF4444">No dissection or fixation</text>
    <text x="15" y="165" font-family="Arial" font-size="10" fill="#FF4444">in danger triangles!</text>
  </g>

  <!-- Title -->
  <text x="400" y="580" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#888">
    Click each triangle to learn about the structures it contains
  </text>

  <!-- Touch Hotspots -->
  <g id="layer-hotspots" data-layer="hotspots" opacity="0">
    <circle cx="400" cy="360" r="60" data-target="triangle_of_doom"/>
    <circle cx="560" cy="450" r="60" data-target="triangle_of_pain"/>
    <circle cx="310" cy="490" r="50" data-target="femoral_triangle"/>
    <circle cx="280" cy="360" r="50" data-target="direct_triangle"/>
    <circle cx="400" cy="360" r="50" data-target="indirect_triangle"/>
  </g>
</svg>
